[project]
name = "investor-intelligence-engine"
version = "1.0.0"
description = "Lightweight production prototype converting unstructured investor data into structured, deduplicated profiles."
authors = [{ name = "Technical Assessment" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "rapidfuzz>=3.8.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "rich>=13.7.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "streamlit>=1.39.0",
    "pandas>=2.2.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

